name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Install pinned age backup test environment
        run: |
          set -euo pipefail
          ZAP_AGE_DIR="$RUNNER_TEMP/zap-age"
          ZAP_AGE_ARCHIVE="$ZAP_AGE_DIR/age-v1.3.2-linux-amd64.tar.gz"
          mkdir -p "$ZAP_AGE_DIR"
          # Official release asset digest: https://github.com/FiloSottile/age/releases/tag/v1.3.2
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 \
            --proto '=https' --proto-redir '=https' \
            'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz' \
            --output "$ZAP_AGE_ARCHIVE"
          printf '%s  %s\n' 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10' "$ZAP_AGE_ARCHIVE" | sha256sum --check -
          tar --extract --gzip --file "$ZAP_AGE_ARCHIVE" --directory "$ZAP_AGE_DIR" \
            --no-same-owner --no-same-permissions age/age age/age-keygen
          sudo install -m 0755 "$ZAP_AGE_DIR/age/age" /usr/bin/age
          sudo install -m 0755 "$ZAP_AGE_DIR/age/age-keygen" /usr/bin/age-keygen
          test "$(/usr/bin/age --version)" = 'v1.3.2'
      - name: Install pinned browser test environment
        run: |
          npm install --prefix "$RUNNER_TEMP/zap-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/zap-browser/node_modules/.bin/playwright" install --with-deps chromium
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const modules = process.env.RUNNER_TEMP + '/zap-browser/node_modules';
          const { chromium } = require(modules + '/playwright');
          appendFileSync(process.env.GITHUB_ENV, 'ZAP_BROWSER_MODULE=' + modules + '/package.json\nZAP_BROWSER_EXECUTABLE=' + chromium.executablePath() + '\n');
          NODE
      - run: node --check public/app.js
      - name: Prepare isolated OpenSSH test runtime
        run: sudo install -d -o root -g root -m 0755 /run/sshd
      - run: npm test
